<div data-bind="if: canManage">
    <button class="btn btn-sm btn-outline-secondary" type="button" data-bind="click: toggle, t: 'contentRestrictions.minimumAge'"></button>
    <div class="border rounded p-2 mt-2" data-bind="if: open">
        <p class="small" data-bind="visible: !enabled(), t: 'contentRestrictions.disabled'"></p>
        <label class="form-label">
            <span data-bind="t: 'contentRestrictions.minimumAge'"></span>
            <select class="form-select form-select-sm" data-bind="options: options, optionsText: 'label', optionsValue: 'age', value: minimumAge, enable: canSave"></select>
        </label>
        <button class="btn btn-sm btn-primary" type="button" data-bind="click: save, enable: canSave, t: 'common.save'"></button>
        <p class="small mb-0" role="status" data-bind="text: message"></p>
    </div>
</div>

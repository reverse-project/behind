<div class="alert alert-warning" role="alert">
    <h2 class="h4" data-bind="t: 'twoFactor.codes.title'">Your recovery codes</h2>
    <p data-bind="t: 'twoFactor.codes.notice'">Store these codes somewhere safe. They are shown only once. Each code works a single time if you lose access to your other methods.</p>
    <ul class="behind-recovery-codes list-unstyled" data-bind="foreach: codes">
        <li class="behind-recovery-code" data-bind="text: $data"></li>
    </ul>
    <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-outline-secondary" data-bind="click: copy, t: 'twoFactor.codes.copy'">Copy</button>
        <button type="button" class="btn btn-outline-secondary" data-bind="click: download, t: 'twoFactor.codes.download'">Download</button>
        <button type="button" class="btn btn-primary" data-bind="click: done, t: doneLabel">Continue</button>
    </div>
    <p class="mt-2 mb-0" role="status" data-bind="visible: hasStatus, text: status"></p>
</div>

<div class="container d-flex flex-wrap align-items-center gap-2 text-body-secondary">
    <strong data-bind="text: name"></strong>
    <span data-bind="visible: hasCopyright, text: copyright"></span>
    <a class="link-secondary" href="#/changelog" data-bind="visible: hasVersion, text: label, tAttr: { title: 'app.changelog' }" title="Changelog"></a>
    <a class="link-secondary" href="#/licenses" title="Licenses" data-bind="t: 'app.licenses', tAttr: { title: 'app.licenses' }">Licenses</a>
    <menu-nav params="name: 'footer'"></menu-nav>
    <button type="button" class="btn btn-outline-secondary btn-sm ms-auto behind-scroll-top" title="Back to top" data-bind="click: scrollToTop, tAttr: { title: 'app.backToTop', 'aria-label': 'app.backToTop' }" aria-label="Back to top"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button>
</div>

<div data-bind="if: manager && (primary() || editAccount())">
    <section class="mt-4">
        <h2 class="h5" data-bind="t: primary() ? 'subaccount.title' : 'subaccount.ownPin'">Subaccounts</h2>
        <form data-bind="submit: save">
            <!-- ko if: primary -->
            <label class="form-label d-block">
                <span data-bind="t: 'subaccount.choose'">Choose an account</span>
                <select class="form-select" data-bind="options: managementAccounts, optionsText: label, optionsCaption: translate('subaccount.new'), value: selected, enable: !busy()"></select>
            </label>
            <!-- ko ifnot: selected() && selected().isPrimary -->
            <label class="form-label d-block">
                <span data-bind="t: 'profile.displayName'">Display name</span>
                <input type="text" maxlength="500" required class="form-control" data-bind="value: name">
            </label>
            <div data-bind="ifnot: selected">
                <label class="form-label d-block">
                    <span data-bind="t: 'subaccount.email'">Sign-in email (optional)</span>
                    <input type="email" maxlength="255" class="form-control" data-bind="value: email">
                </label>
            </div>
            <label class="form-check mb-2">
                <input type="checkbox" class="form-check-input" data-bind="checked: child">
                <span data-bind="t: 'subaccount.child'">Child account</span>
            </label>
            <label class="form-label d-block">
                <span data-bind="t: 'profile.birthday'">Birthday (optional)</span>
                <input type="date" class="form-control" data-bind="value: birthday">
            </label>
            <!-- /ko -->
            <!-- /ko -->
            <!-- ko if: !primary() && editAccount() && editAccount().hasPin -->
            <label class="form-label d-block">
                <span data-bind="t: 'subaccount.yourCurrentPin'">Your current switching PIN</span>
                <input class="form-control" type="password" inputmode="numeric" required autocomplete="off" data-bind="textInput: credential">
            </label>
            <!-- /ko -->
            <label class="form-label d-block">
                <span data-bind="t: !primary() ? 'subaccount.ownNewPin' : editAccount() && editAccount().hasPin ? 'subaccount.replacePin' : 'subaccount.pin'"></span>
                <input class="form-control" type="password" inputmode="numeric" pattern="[0-9]+" maxlength="128" autocomplete="new-password" data-bind="textInput: pin, enable: !clearPin(), attr: { required: !primary() && !clearPin() }">
            </label>
            <label class="form-check mb-2" data-bind="visible: editAccount() && editAccount().hasPin">
                <input class="form-check-input" type="checkbox" data-bind="checked: clearPin">
                <span data-bind="t: 'subaccount.clearPin'">Remove current PIN</span>
            </label>
            <fieldset class="mb-3" data-bind="if: primary() && !selected() && !primaryHasPin()">
                <legend class="h6" data-bind="t: 'subaccount.primaryLabel'">Primary account</legend>
                <label class="form-label d-block" data-bind="ifnot: skipPrimaryPin">
                    <span data-bind="t: 'subaccount.primaryPin'">Set a PIN to switch back to your primary account</span>
                    <input class="form-control" type="password" inputmode="numeric" pattern="[0-9]+" maxlength="128" required autocomplete="new-password" data-bind="textInput: primaryPin">
                </label>
                <label class="form-check">
                    <input class="form-check-input" type="checkbox" data-bind="checked: skipPrimaryPin">
                    <span data-bind="t: 'subaccount.skipPrimaryPin'">Skip setting a primary PIN</span>
                </label>
                <p class="alert alert-warning mt-2" role="status" data-bind="visible: skipPrimaryPin, t: 'subaccount.primaryWarning'">Without a primary PIN, you must sign in again to return to your primary account.</p>
            </fieldset>
            <fieldset class="mb-3" data-bind="if: primary() && needsProof()">
                <legend class="h6" data-bind="t: 'subaccount.proofRequired'"></legend>
                <p class="alert alert-warning" data-bind="visible: !proofMethods().length, t: 'subaccount.noProofMethod'"></p>
                <select class="form-select" data-bind="visible: proofMethods().length, options: proofMethods, optionsText: proofLabel, value: proofMethod, attr: { 'aria-label': translate('subaccount.proofRequired') }"></select>
                <button type="button" class="btn btn-outline-secondary" data-bind="visible: proofMethod() === 'magicToken', click: requestPinProof, enable: !busy(), t: 'subaccount.sendProof'"></button>
                <label class="form-label d-block" data-bind="if: proofMethods().length">
                    <span data-bind="text: proofMethod() === 'magicToken' ? translate('subaccount.pasteProof') : proofLabel(proofMethod())"></span>
                    <input class="form-control" type="password" autocomplete="off" required data-bind="textInput: credential">
                </label>
            </fieldset>
            <button type="submit" class="btn btn-primary" data-bind="enable: !busy() && (!pinOnly() || changingPin()), t: editAccount() ? 'common.save' : 'subaccount.create'"></button>
        </form>
        <div class="mt-3" data-bind="if: primary() && canBrowseAndRelease() && selected() && !selected().isPrimary">
            <button type="button" class="btn btn-outline-danger" data-bind="click: release, enable: !busy() && selected().canRelease, t: 'subaccount.release'"></button>
            <p class="form-text" data-bind="visible: !selected().canRelease, t: 'subaccount.recovery'"></p>
        </div>
        <!-- ko if: linkRequiresDirectSignIn -->
        <p class="alert alert-info mt-3">
            <span data-bind="t: 'subaccount.linkDirectSignInHelp'"></span>
            <a href="#/sign-in" data-bind="t: 'subaccount.primary'">Sign in to primary account</a>
        </p>
        <!-- /ko -->
    </section>
    <section class="mt-4" data-bind="if: primary() && canBrowseAndRelease()">
        <h2 class="h5" data-bind="t: linkEnabled() ? 'subaccount.linkExisting' : 'subaccount.browse'"></h2>
        <form data-bind="submit: search">
            <label class="form-label d-block">
                <span data-bind="t: 'subaccount.find'"></span>
                <input type="search" class="form-control" data-bind="value: query, enable: !busy()">
            </label>
            <button class="btn btn-outline-primary" type="submit" data-bind="enable: !busy(), t: 'subaccount.browse'"></button>
        </form>
        <ul class="list-unstyled mt-2" data-bind="foreach: candidates">
            <li class="mb-2">
                <span data-bind="text: displayName"></span>
                <button type="button" class="btn btn-sm btn-outline-primary" data-bind="visible: $parent.linkEnabled, click: $parent.requestLink, enable: !$parent.busy(), t: 'subaccount.requestLink'"></button>
            </li>
        </ul>
        <button type="button" class="btn btn-outline-secondary mb-2" data-bind="visible: moreCandidates, enable: !busy(), click: loadMore, t: 'subaccount.more'"></button>
        <div data-bind="if: requests().length">
            <h3 class="h6" data-bind="t: 'subaccount.proposedParents'"></h3>
            <p data-bind="t: 'subaccount.consentHelp'"></p>
            <ul class="list-unstyled" data-bind="foreach: requests">
                <li class="mb-2">
                    <span data-bind="text: displayName"></span>
                    <button type="button" class="btn btn-sm btn-primary" data-bind="click: $parent.confirmLink, enable: !$parent.busy(), t: 'subaccount.accept'"></button>
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-bind="click: $parent.declineLink, enable: !$parent.busy(), t: 'subaccount.decline'"></button>
                </li>
            </ul>
        </div>
    </section>
</div>
<div data-bind="if: !manager && (accounts().length || linked())">
    <details class="px-3 py-1" data-bind="click: function () { return true; }, clickBubble: false">
        <summary data-bind="t: 'subaccount.switch'">Switch User</summary>
        <form class="mt-2" data-bind="submit: switchUser, visible: accounts().length">
            <label class="d-block">
                <span data-bind="t: 'subaccount.choose'">Choose an account</span>
                <select class="form-select" required data-bind="options: accounts, optionsText: label, optionsCaption: translate('subaccount.choose'), value: selected"></select>
            </label>
            <div data-bind="if: selected() && selected().hasPin">
                <label class="d-block">
                    <span data-bind="t: 'subaccount.enterPin'">Enter PIN</span>
                    <input class="form-control" type="password" inputmode="numeric" pattern="[0-9]+" maxlength="128" autocomplete="off" required data-bind="value: pin">
                </label>
            </div>
            <button class="btn btn-primary mt-2" type="submit" data-bind="enable: selected() && !busy(), t: 'subaccount.switch'">Switch User</button>
        </form>
        <a href="#/sign-in" data-bind="visible: linked, t: 'subaccount.primary'">Sign in to primary account</a>
    </details>
</div>
<p class="small mt-2" role="status" data-bind="visible: message, text: message"></p>

<div>
    <div data-bind="visible: showChallenge">
        <h2 class="h4 mb-3" data-bind="t: 'twoFactor.challenge.title'">Two-factor authentication</h2>
        <form data-bind="visible: showTotpForm, submit: verifyTotp">
            <div class="mb-3">
                <label class="form-label" for="two-factor-code" data-bind="t: 'twoFactor.challenge.codeLabel'">Authentication code</label>
                <input id="two-factor-code" class="form-control" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" required data-bind="value: code">
                <div class="form-text" data-bind="t: 'twoFactor.challenge.totpHelp'">Enter the 6-digit code from your authenticator app.</div>
            </div>
            <button type="submit" class="btn btn-primary" data-bind="enable: !busy(), t: 'twoFactor.challenge.verify'">Verify</button>
        </form>
        <form data-bind="visible: showRecoveryForm, submit: verifyRecovery">
            <div class="mb-3">
                <label class="form-label" for="two-factor-recovery" data-bind="t: 'twoFactor.challenge.recoveryLabel'">Recovery code</label>
                <input id="two-factor-recovery" class="form-control behind-recovery-input" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" required data-bind="value: recoveryCode">
                <div class="form-text" data-bind="t: 'twoFactor.challenge.recoveryHelp'">Enter one of your 8-character recovery codes. Each code works only once.</div>
            </div>
            <button type="submit" class="btn btn-primary" data-bind="enable: !busy(), t: 'twoFactor.challenge.verify'">Verify</button>
        </form>
        <div data-bind="visible: setupRequired">
            <p class="alert alert-info" role="status" data-bind="t: 'twoFactor.setup.required'">Two-factor authentication is required. Set up one of the methods below to continue.</p>
            <div class="d-flex flex-wrap gap-2 mb-3">
                <button type="button" class="btn btn-primary" data-bind="enable: !busy(), click: startTotp, t: 'twoFactor.setup.authenticator'">Set up an authenticator app</button>
            </div>
            <div data-bind="if: hasEnrollment">
                <totp-enrollment params="enrollment: enrollment, code: enrollmentCode, confirm: confirmTotp, busy: busy"></totp-enrollment>
            </div>
            <div class="mt-3" data-bind="visible: passkeyAvailable">
                <div class="mb-3">
                    <label class="form-label" for="two-factor-passkey-name" data-bind="t: 'twoFactor.passkeys.nameLabel'">Passkey name (optional)</label>
                    <input id="two-factor-passkey-name" class="form-control" type="text" maxlength="100" autocomplete="off" data-bind="value: passkeyName">
                </div>
                <button type="button" class="btn btn-primary" data-bind="enable: !busy(), click: registerPasskey, t: 'twoFactor.setup.passkey'">Register a passkey</button>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2 mt-3">
            <button type="button" class="btn btn-outline-secondary" data-bind="visible: passkeyAvailable() && !setupRequired(), enable: !busy(), click: usePasskey, t: 'twoFactor.challenge.usePasskey'">Use a passkey</button>
            <button type="button" class="btn btn-link" data-bind="visible: canSwitchCode() && !usingRecovery(), click: toggleRecovery, t: 'twoFactor.challenge.useRecovery'">Use a recovery code</button>
            <button type="button" class="btn btn-link" data-bind="visible: canSwitchCode() && usingRecovery(), click: toggleRecovery, t: 'twoFactor.challenge.useTotp'">Use an authenticator code</button>
            <button type="button" class="btn btn-link" data-bind="enable: !busy(), click: back, t: 'twoFactor.challenge.back'">Back to sign in</button>
        </div>
        <p class="mt-3" role="status" data-bind="visible: hasMessage, text: message"></p>
    </div>
    <div data-bind="visible: showCodes">
        <recovery-codes params="codes: recoveryCodes, done: proceed, doneLabel: 'twoFactor.codes.continue'"></recovery-codes>
    </div>
</div>

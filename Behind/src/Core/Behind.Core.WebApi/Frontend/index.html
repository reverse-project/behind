<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Behind</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/fontawesome.min.css">
    <link rel="stylesheet" href="css/solid.min.css">
    <link rel="stylesheet" href="css/quill.snow.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="libraries/require.min.js" data-main="bootloader.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">
<header id="header-container">
    <nav class="navbar navbar-expand-md border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#/" data-bind="text: title">Behind</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navigation" aria-controls="navigation" aria-expanded="false" aria-label="Toggle navigation" data-bind="tAttr: { 'aria-label': 'app.toggleNavigation' }">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navigation">
                <menu-items params="items: links, variant: 'navbar'"></menu-items>
                <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item dropdown" data-bind="visible: isSignedIn">
                        <button type="button" class="nav-link dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" data-bind="text: label"></button>
                        <div class="dropdown-menu">
                            <menu-items params="items: userItems, variant: 'dropdown'"></menu-items>
                            <hr class="dropdown-divider">
                            <button type="button" class="dropdown-item" data-bind="click: signOut, t: 'app.signOut'">Sign out</button>
                        </div>
                    </li>
                    <li class="nav-item" data-bind="visible: !isSignedIn() && canSignIn()"><a class="nav-link" href="#/sign-in" data-bind="t: 'app.signIn'">Sign in</a></li>
                    <li class="nav-item" data-bind="visible: !isSignedIn() && canSignUp()"><a class="nav-link" href="#/sign-up" data-bind="t: 'app.signUp'">Sign up</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="alert alert-warning rounded-0 mb-0 border-0 border-bottom" role="alert" data-bind="visible: isImpersonating">
        <div class="container d-flex flex-wrap align-items-center gap-2">
            <span data-bind="t: { key: 'app.impersonating', args: [label] }">You are impersonating <strong data-bind="text: label"></strong>. Everything you do is recorded in the audit log on their behalf.</span>
            <button type="button" class="btn btn-sm btn-warning ms-md-auto" data-bind="click: stopImpersonating, t: 'app.stopImpersonating'">Stop impersonating</button>
        </div>
    </div>
</header>
<main id="main-container" class="container my-4 behind-main flex-grow-1">
    <div id="page-loading" class="d-flex justify-content-center align-items-center py-5" role="status">
        <div class="spinner-border text-primary">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
</main>
<footer id="footer-container" class="border-top py-3 mt-auto">
    <div class="container d-flex flex-wrap align-items-center gap-2 text-body-secondary">
        <strong data-bind="text: name"></strong>
        <span data-bind="visible: hasCopyright, text: copyright"></span>
        <a class="link-secondary" href="#/changelog" data-bind="visible: hasVersion, text: label, tAttr: { title: 'app.changelog' }" title="Changelog"></a>
        <a class="link-secondary" href="#/licenses" title="Licenses" data-bind="t: 'app.licenses', tAttr: { title: 'app.licenses' }">Licenses</a>
        <menu-nav params="name: 'footer'"></menu-nav>
    </div>
</footer>
<noscript>
    <div class="alert alert-warning m-3" role="alert">This application requires JavaScript.</div>
</noscript>
</body>
</html>

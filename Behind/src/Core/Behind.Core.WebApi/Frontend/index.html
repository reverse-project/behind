<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Behind</title>
    <link rel="stylesheet" href="css/app.css">
    <script src="libraries/require.min.js" data-main="bootloader.js"></script>
</head>
<body>
<header id="header-container" class="behind-header">
    <strong>Behind</strong>
    <nav>
        <a href="#/">Index</a>
        <a href="#/session" data-bind="visible: isSignedIn, text: label"></a>
        <a href="#/sign-in" data-bind="visible: !isSignedIn()">Sign in</a>
        <a href="#/sign-up" data-bind="visible: !isSignedIn()">Sign up</a>
        <button type="button" data-bind="visible: isSignedIn, click: signOut">Sign out</button>
    </nav>
</header>
<main id="main-container"></main>
<noscript>This application requires JavaScript.</noscript>
</body>
</html>

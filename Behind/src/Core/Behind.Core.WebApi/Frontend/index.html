<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Behind</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/fontawesome.min.css">
    <link rel="stylesheet" href="css/solid.min.css">
    <link rel="stylesheet" href="css/app.css">
    <script src="libraries/require.min.js" data-main="bootloader.js"></script>
</head>
<body>
<header id="header-container">
    <nav class="navbar navbar-expand-md border-bottom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#/">Behind</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navigation" aria-controls="navigation" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navigation">
                <ul class="navbar-nav me-auto mb-2 mb-md-0">
                    <li class="nav-item"><a class="nav-link" href="#/">Index</a></li>
                    <li class="nav-item"><a class="nav-link" href="#/wall-of-shame">Wall of shame</a></li>
                    <li class="nav-item dropdown" data-bind="visible: isSignedIn">
                        <button type="button" class="nav-link dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" data-bind="text: label"></button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#/profile">Profile</a></li>
                            <li><a class="dropdown-item" href="#/session">Session</a></li>
                            <li><a class="dropdown-item" href="#/sessions">Sessions</a></li>
                            <li data-bind="visible: canAdminister"><a class="dropdown-item" href="#/administration">Administration</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><button type="button" class="dropdown-item" data-bind="click: signOut">Sign out</button></li>
                        </ul>
                    </li>
                    <li class="nav-item" data-bind="visible: !isSignedIn()"><a class="nav-link" href="#/sign-in">Sign in</a></li>
                    <li class="nav-item" data-bind="visible: !isSignedIn()"><a class="nav-link" href="#/sign-up">Sign up</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="alert alert-warning rounded-0 mb-0 border-0 border-bottom" role="alert" data-bind="visible: isImpersonating">
        <div class="container d-flex flex-wrap align-items-center gap-2">
            <span>You are impersonating <strong data-bind="text: label"></strong>. Everything you do is recorded in the audit log on their behalf.</span>
            <button type="button" class="btn btn-sm btn-outline-dark ms-md-auto" data-bind="click: stopImpersonating">Stop impersonating</button>
        </div>
    </div>
</header>
<main id="main-container" class="container my-4 behind-main"></main>
<noscript>
    <div class="alert alert-warning m-3" role="alert">This application requires JavaScript.</div>
</noscript>
</body>
</html>

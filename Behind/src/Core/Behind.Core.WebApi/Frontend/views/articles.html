<section class="behind-wide">
    <h1 class="mb-3" data-bind="t: 'articles.title'">Articles</h1>
    <div class="alert alert-info" role="alert" data-bind="visible: hasMessage, text: message"></div>
    <form class="input-group mb-3" data-bind="submit: find">
        <input class="form-control" type="search" maxlength="200" placeholder="Search by title or content" aria-label="Search articles" data-bind="value: search, tAttr: { placeholder: 'articles.searchByTitleOrContent', 'aria-label': 'articles.search' }">
        <button type="submit" class="btn btn-primary" data-bind="enable: !busy(), t: 'common.search'">Search</button>
    </form>
    <div class="d-flex flex-wrap gap-2 mb-3" role="group" aria-label="Article categories" data-bind="foreach: filters, tAttr: { 'aria-label': 'articles.categoriesTitle' }">
        <button type="button" class="btn btn-sm" data-bind="text: name, css: isSelected ? 'btn-primary' : 'btn-outline-primary', click: select"></button>
    </div>
    <img class="news-header-image mb-3" data-bind="visible: hasBanner, attr: { src: bannerUrl, alt: bannerName }">
    <p class="text-body-secondary" data-bind="visible: isEmpty, t: 'articles.empty'">There are no articles to show.</p>
    <div data-bind="foreach: items">
        <article class="card mb-3">
            <img class="card-img-top news-card-image" data-bind="visible: imageUrl !== null, attr: { src: imageUrl, alt: categoryName }">
            <div class="card-body">
                <h2 class="h4 card-title"><a class="text-break" data-bind="attr: { href: href }, text: title"></a></h2>
                <div class="d-flex flex-wrap align-items-center gap-2 small text-body-secondary mb-2">
                    <a data-bind="text: author, attr: { href: authorHref }"></a>
                    <span data-bind="text: stamp, attr: { title: created }"></span>
                    <span class="badge text-bg-secondary" data-bind="visible: hasCategory, text: categoryName"></span>
                </div>
                <div class="site-content mb-2" data-bind="html: summary"></div>
                <a data-bind="attr: { href: href }, t: 'content.readMore'">Read more</a>
            </div>
        </article>
    </div>
    <pager class="d-block" params="pager: pager"></pager>
</section>

<section>
    <h1 class="mb-3" data-bind="t: 'changelog.title'">Changelog</h1>
    <p class="mb-3">
        <span data-bind="t: 'changelog.mirror'">Public mirror:</span>
        <a href="https://github.com/reverse-project/behind" target="_blank" rel="noopener noreferrer">https://github.com/reverse-project/behind</a>
    </p>
    <div class="alert alert-danger" role="alert" data-bind="visible: failed, t: 'changelog.failed'">The changelog could not be loaded.</div>
    <p class="text-body-secondary" data-bind="visible: isEmpty, t: 'changelog.empty'">There are no releases yet.</p>
    <div data-bind="foreach: releases">
        <article class="mb-4">
            <h2 class="h4 d-flex flex-wrap align-items-baseline gap-2">
                <span data-bind="text: 'v' + version"></span>
                <small class="text-body-secondary" data-bind="text: date"></small>
            </h2>
            <ul class="list-group" data-bind="foreach: changes">
                <li class="list-group-item d-flex flex-wrap align-items-baseline gap-2">
                    <span class="badge text-bg-secondary" data-bind="text: type"></span>
                    <span class="text-break" data-bind="text: text"></span>
                </li>
            </ul>
        </article>
    </div>
</section>

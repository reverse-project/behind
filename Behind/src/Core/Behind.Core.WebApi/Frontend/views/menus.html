<section class="behind-wide">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <h1 class="mb-0" data-bind="t: 'menus.title'">Menus</h1>
        <a class="btn btn-outline-secondary ms-auto" href="#/administration" data-bind="t: 'menus.back'">Back to administration</a>
    </div>
    <p data-bind="visible: !isSignedIn()"><span data-bind="t: 'common.notSignedIn'">You are not signed in.</span> <a href="#/sign-in" data-bind="t: 'app.signIn'">Sign in</a> <span data-bind="t: 'menus.signInToManage'">to manage menus.</span></p>
    <div class="alert alert-warning" role="alert" data-bind="visible: isDenied, t: 'menus.denied'">You need menu access to manage menus.</div>
    <div class="alert alert-info" role="alert" data-bind="visible: list.hasMessage, text: list.message"></div>
    <div data-bind="visible: canRead">
        <form class="card card-body mb-4" data-bind="visible: canWrite, submit: save">
            <h2 class="h5" data-bind="text: heading"></h2>
            <div class="mb-3">
                <label class="form-label" for="menu-name" data-bind="t: 'common.name'">Name</label>
                <input id="menu-name" class="form-control" type="text" maxlength="200" data-bind="value: name, valueUpdate: 'input', enable: !editingBuiltIn()">
                <div class="form-text" data-bind="t: { key: 'menus.nameHelp', args: ['footer'] }">The name is used to request the menu, for example <code>footer</code>. It is turned into lowercase letters, digits and dashes.</div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="menu-title" data-bind="t: 'common.title'">Title</label>
                <input id="menu-title" class="form-control" type="text" maxlength="200" data-bind="value: title, valueUpdate: 'input'">
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary" data-bind="enable: canSave, t: 'common.save'">Save</button>
                <button type="button" class="btn btn-outline-secondary" data-bind="visible: isEditing, click: reset, t: 'common.cancel'">Cancel</button>
            </div>
        </form>
        <div data-bind="with: list">
            <form class="input-group mb-3" data-bind="submit: find">
                <input class="form-control" type="search" maxlength="200" placeholder="Search by name or title" aria-label="Search menus" data-bind="value: search, tAttr: { placeholder: 'menus.search.placeholder', 'aria-label': 'menus.search.label' }">
                <button type="submit" class="btn btn-primary" data-bind="enable: !busy(), t: 'common.search'">Search</button>
            </form>
            <div class="form-check form-switch mb-3" data-bind="visible: canViewDeleted">
                <label class="form-check-label"><input class="form-check-input" type="checkbox" role="switch" data-bind="checked: showDeleted, enable: !busy()"> <span data-bind="t: 'menus.showDeleted'">Show deleted menus</span></label>
            </div>
            <letter-pager class="d-block mb-3" params="pager: letterPager"></letter-pager>
            <p class="text-body-secondary" data-bind="visible: !hasItems(), t: 'menus.empty'">No menus found.</p>
            <ul class="list-group mb-3" data-bind="foreach: items">
                <li class="list-group-item d-flex flex-wrap align-items-center gap-2">
                    <div class="me-auto">
                        <strong class="text-break" data-bind="text: label"></strong>
                        <code class="ms-2" data-bind="text: name"></code>
                        <span class="text-body-secondary small ms-2" data-bind="t: { key: 'menus.itemCount', args: [itemCount] }"><span data-bind="text: itemCount"></span> items</span>
                    </div>
                    <span class="badge text-bg-secondary" data-bind="visible: isBuiltIn, t: 'menus.builtIn'">Built-in</span>
                    <span class="badge text-bg-dark" data-bind="visible: isDeleted, t: 'common.deleted'">Deleted</span>
                    <a class="btn btn-sm btn-outline-primary" data-bind="attr: { href: itemsHref }, t: 'menus.items'">Items</a>
                    <button type="button" class="btn btn-sm btn-outline-primary" data-bind="visible: !isDeleted && $root.canWrite(), enable: !$parent.busy(), click: edit, t: 'common.edit'">Edit</button>
                    <button type="button" class="btn btn-sm btn-outline-danger" data-bind="visible: !isDeleted && !isBuiltIn && $root.canDelete(), enable: !$parent.busy(), click: remove, t: 'common.delete'">Delete</button>
                    <button type="button" class="btn btn-sm btn-outline-success" data-bind="visible: isDeleted && $parent.canViewDeleted(), enable: !$parent.busy(), click: restore, t: 'common.restore'">Restore</button>
                    <button type="button" class="btn btn-sm btn-danger" data-bind="visible: isDeleted && $parent.canViewDeleted(), enable: !$parent.busy(), click: hardDelete, t: 'common.deletePermanently'">Delete permanently</button>
                </li>
            </ul>
            <pager class="d-block" params="pager: pager"></pager>
        </div>
    </div>
</section>

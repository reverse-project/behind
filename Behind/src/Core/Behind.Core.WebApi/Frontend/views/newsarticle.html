<article class="behind-wide">
    <p class="text-body-secondary" data-bind="visible: loading, t: 'content.loading'">Loading...</p>
    <div class="alert alert-warning" role="alert" data-bind="visible: missing, text: message"></div>
    <div data-bind="visible: found">
        <a class="d-inline-block mb-3" href="#/news" data-bind="t: 'news.backToNews'">Back to news</a>
        <img class="news-header-image mb-3" data-bind="visible: hasImage, attr: { src: imageUrl, alt: categoryName }">
        <h1 class="mb-2 text-break" data-bind="text: title"></h1>
        <div class="d-flex flex-wrap align-items-center gap-2 small text-body-secondary mb-4">
            <a data-bind="text: author, attr: { href: authorHref }, visible: authorHref"></a>
            <span data-bind="text: author, visible: !authorHref()"></span>
            <span data-bind="text: stamp, attr: { title: created }"></span>
            <span class="badge text-bg-warning" data-bind="visible: isHighlighted, t: 'news.highlighted'">Highlighted</span>
            <span class="badge text-bg-secondary" data-bind="visible: hasCategory, text: categoryName"></span>
        </div>
        <div class="site-content mb-5" data-bind="html: content"></div>
        <section aria-labelledby="news-comments-heading" data-bind="visible: commentsEnabled">
            <h2 class="h4" id="news-comments-heading" data-bind="t: 'news.comments'">Comments</h2>
            <div class="alert alert-info" role="alert" data-bind="visible: hasCommentMessage, text: commentMessage"></div>
            <p class="text-body-secondary" data-bind="visible: !hasComments(), t: 'news.noComments'">No comments yet.</p>
            <ul class="list-group mb-3" data-bind="foreach: comments">
                <li class="list-group-item">
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <a class="fw-bold text-break" data-bind="text: author, attr: { href: authorHref }, visible: authorHref"></a>
                        <strong class="text-break" data-bind="text: author, visible: !authorHref"></strong>
                        <span class="badge text-bg-secondary" data-bind="visible: isAnonymous && authorHref, t: 'comments.anonymous'">Anonymous</span>
                        <span class="small text-body-secondary" data-bind="text: createdAt"></span>
                        <span class="small text-body-secondary fst-italic" data-bind="visible: isEdited, text: editedAt"></span>
                        <span class="ms-auto d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-outline-primary" data-bind="visible: canEdit && !isEditing(), enable: !$root.busy(), click: startEdit, t: 'common.edit'">Edit</button>
                            <button type="button" class="btn btn-sm btn-outline-danger" data-bind="visible: canDelete, enable: !$root.busy(), click: remove, t: 'common.delete'">Delete</button>
                            <report-button params="sourceType: 'newsComment', sourceId: id"></report-button>
                        </span>
                    </div>
                    <div class="text-break news-comment" data-bind="visible: !isEditing(), text: content"></div>
                    <content-age params="entityType: 'NewsComment', id: id, allowed: canEdit"></content-age>
                    <form class="mt-2" data-bind="visible: isEditing, submit: saveEdit">
                        <textarea class="form-control mb-2" rows="3" maxlength="2000" aria-label="Edit comment" data-bind="value: draft, valueUpdate: 'input', tAttr: { 'aria-label': 'news.editComment' }"></textarea>
                        <label class="form-check mb-2">
                            <input type="checkbox" class="form-check-input" data-bind="checked: draftAnonymous">
                            <span class="form-check-label" data-bind="t: 'comments.postAnonymously'">Hide my identity publicly</span>
                        </label>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-sm btn-primary" data-bind="enable: canSaveEdit, t: 'common.save'">Save</button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" data-bind="click: cancelEdit, t: 'common.cancel'">Cancel</button>
                        </div>
                    </form>
                </li>
            </ul>
            <pager class="d-block mb-3" params="pager: pager"></pager>
            <form data-bind="visible: isSignedIn, submit: post">
                <label class="form-label" for="news-new-comment" data-bind="t: 'news.addComment'">Add a comment</label>
                <textarea id="news-new-comment" class="form-control mb-2" rows="3" maxlength="2000" data-bind="value: newComment, valueUpdate: 'input'"></textarea>
                <label class="form-check mb-2">
                    <input type="checkbox" class="form-check-input" data-bind="checked: isAnonymous">
                    <span class="form-check-label" data-bind="t: 'comments.postAnonymously'">Hide my identity publicly</span>
                </label>
                <p class="form-text" data-bind="t: 'comments.anonymousNotice'">Moderators can still see your profile.</p>
                <button type="submit" class="btn btn-primary" data-bind="enable: canPost, t: 'news.postComment'">Comment</button>
            </form>
            <p data-bind="visible: !isSignedIn()"><a href="#/sign-in" data-bind="t: 'app.signIn'">Sign in</a> <span data-bind="t: 'news.signInToComment'">to comment.</span></p>
        </section>
    </div>
</article>

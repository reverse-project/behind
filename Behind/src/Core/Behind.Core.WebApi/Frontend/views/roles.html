<section class="behind-wide">
    <h1 class="mb-3" data-bind="t: 'roles.title'">Roles</h1>
    <p data-bind="visible: !isSignedIn()"><span data-bind="t: 'profile.notSignedIn'">You are not signed in.</span> <a href="#/sign-in" data-bind="t: 'app.signIn'">Sign in</a> <span data-bind="t: 'roles.signInToManage'">to manage roles.</span></p>
    <div class="alert alert-warning" role="alert" data-bind="visible: isDenied, t: 'roles.denied'">You need role management access to manage roles.</div>
    <div class="alert alert-info" role="alert" data-bind="visible: hasMessage, text: message"></div>
    <div data-bind="visible: canManage">
        <form class="input-group mb-3" data-bind="submit: create">
            <input class="form-control" type="text" maxlength="100" placeholder="New role name" aria-label="New role name" data-bind="value: newName, valueUpdate: 'input', tAttr: { placeholder: 'roles.newNamePlaceholder', 'aria-label': 'roles.newNameLabel' }">
            <button type="submit" class="btn btn-primary" data-bind="enable: canCreate, t: 'roles.create'">Create role</button>
        </form>
        <form class="input-group mb-3" data-bind="submit: list.find">
            <input class="form-control" type="search" maxlength="200" placeholder="Search by name" aria-label="Search roles" data-bind="value: list.search, tAttr: { placeholder: 'roles.searchPlaceholder', 'aria-label': 'roles.searchLabel' }">
            <button type="submit" class="btn btn-primary" data-bind="enable: !busy(), t: 'common.search'">Search</button>
        </form>
        <div class="form-check form-switch mb-3" data-bind="visible: list.canViewDeleted">
            <label class="form-check-label"><input class="form-check-input" type="checkbox" role="switch" data-bind="checked: list.showDeleted, enable: !busy()"> <span data-bind="t: 'roles.showDeleted'">Show deleted roles</span></label>
        </div>
        <letter-pager class="d-block mb-3" params="pager: list.letterPager"></letter-pager>
        <p class="text-body-secondary" data-bind="visible: !hasRoles(), t: 'roles.empty'">No roles found.</p>
        <ul class="list-group mb-3" data-bind="foreach: roles">
            <li class="list-group-item">
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <strong class="text-break" data-bind="text: name"></strong>
                    <span class="badge text-bg-secondary" data-bind="visible: isBuiltIn, t: 'roles.builtIn'">Built-in</span>
                    <span class="badge text-bg-dark" data-bind="visible: isDeleted, t: 'common.deleted'">Deleted</span>
                </div>
                <div class="small text-body-secondary mt-2" data-bind="t: 'roles.grants'">Grants</div>
                <p class="small mb-2" data-bind="visible: grants.length === 0, t: 'common.none'">None</p>
                <div class="d-flex flex-wrap gap-1 mb-2" data-bind="foreach: grants">
                    <span class="badge text-bg-success" data-bind="text: $data"></span>
                </div>
                <div class="small text-body-secondary" data-bind="t: 'roles.restrictions'">Restrictions</div>
                <p class="small mb-2" data-bind="visible: restrictions.length === 0, t: 'common.none'">None</p>
                <div class="d-flex flex-wrap gap-1 mb-2" data-bind="foreach: restrictions">
                    <span class="badge text-bg-danger" data-bind="text: $data"></span>
                </div>
                <div class="d-flex flex-wrap gap-2" data-bind="visible: !editing()">
                    <button type="button" class="btn btn-sm btn-outline-primary" data-bind="visible: canEdit, enable: !$root.busy(), click: edit, t: 'roles.editAccess'">Edit access</button>
                    <button type="button" class="btn btn-sm btn-outline-danger" data-bind="visible: canDelete, enable: !$root.busy(), click: remove, t: 'common.delete'">Delete</button>
                    <button type="button" class="btn btn-sm btn-outline-success" data-bind="visible: isDeleted && $root.list.canViewDeleted(), enable: !$root.busy(), click: restore, t: 'common.restore'">Restore</button>
                    <button type="button" class="btn btn-sm btn-danger" data-bind="visible: isDeleted && $root.list.canViewDeleted(), enable: !$root.busy(), click: hardDelete, t: 'common.deletePermanently'">Delete permanently</button>
                </div>
                <div class="mt-3" data-bind="visible: editing">
                    <p class="small text-body-secondary mb-2" data-bind="t: 'roles.editHelp'">A restriction always wins over a grant, for every user who has this role.</p>
                    <access-editor params="access: editor, enabled: !$root.busy()"></access-editor>
                    <div class="d-flex gap-2 mt-3">
                        <button type="button" class="btn btn-sm btn-primary" data-bind="enable: !$root.busy(), click: save, t: 'common.save'">Save</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" data-bind="click: cancel, t: 'common.cancel'">Cancel</button>
                    </div>
                </div>
            </li>
        </ul>
        <pager class="d-block" params="pager: list.pager"></pager>
    </div>
</section>

<section>
    <h1 class="mb-3" data-bind="t: 'session.title'">Session</h1>
    <p data-bind="visible: !isSignedIn()"><span data-bind="t: 'profile.notSignedIn'">You are not signed in.</span> <a href="#/sign-in" data-bind="t: 'app.signIn'">Sign in</a> <span data-bind="t: 'session.signInToSee'">to see your session.</span></p>
    <div class="alert alert-info" role="alert" data-bind="visible: hasMessage, text: message"></div>
    <div data-bind="with: details">
        <h2 class="h4 mt-4" data-bind="t: 'session.user'">User</h2>
        <dl class="row behind-details">
            <dt class="col-sm-4" data-bind="t: 'session.name'">Name</dt>
            <dd class="col-sm-8"><a data-bind="text: displayName, attr: { href: profileHref }"></a></dd>
            <dt class="col-sm-4" data-bind="t: 'session.userId'">User id</dt>
            <dd class="col-sm-8" data-bind="text: userId"></dd>
            <dt class="col-sm-4" data-bind="t: 'session.emails'">Emails</dt>
            <dd class="col-sm-8">
                <ul class="list-unstyled mb-0" data-bind="foreach: emails">
                    <li data-bind="text: $data"></li>
                </ul>
            </dd>
            <dt class="col-sm-4" data-bind="t: 'session.roles'">Roles</dt>
            <dd class="col-sm-8">
                <ul class="list-unstyled mb-0" data-bind="foreach: roles">
                    <li><strong data-bind="text: name"></strong> <span class="text-body-secondary" data-bind="text: grants"></span></li>
                </ul>
            </dd>
        </dl>
        <h2 class="h4 mt-4" data-bind="t: 'session.details'">Details</h2>
        <dl class="row behind-details">
            <dt class="col-sm-4" data-bind="t: 'session.sessionId'">Session id</dt>
            <dd class="col-sm-8" data-bind="text: sessionId"></dd>
            <dt class="col-sm-4" data-bind="t: 'session.started'">Started</dt>
            <dd class="col-sm-8" data-bind="text: startedAt"></dd>
            <dt class="col-sm-4" data-bind="t: 'session.age'">Age</dt>
            <dd class="col-sm-8" data-bind="text: length"></dd>
            <dt class="col-sm-4" data-bind="t: 'session.expires'">Expires</dt>
            <dd class="col-sm-8" data-bind="t: { key: 'session.expiresIn', args: [expiresAt, remaining] }"></dd>
            <dt class="col-sm-4" data-bind="t: 'session.accessTokenIssued'">Access token issued</dt>
            <dd class="col-sm-8" data-bind="text: accessTokenIssuedAt"></dd>
            <dt class="col-sm-4" data-bind="t: 'session.accessTokenExpires'">Access token expires</dt>
            <dd class="col-sm-8" data-bind="t: { key: 'session.expiresIn', args: [accessTokenExpiresAt, accessTokenRemaining] }"></dd>
            <dt class="col-sm-4" data-bind="t: 'session.remoteAddress'">Remote address</dt>
            <dd class="col-sm-8" data-bind="text: remoteAddress"></dd>
            <dt class="col-sm-4" data-bind="t: 'session.userAgent'">User agent</dt>
            <dd class="col-sm-8" data-bind="text: userAgent"></dd>
        </dl>
    </div>
    <button type="button" class="btn btn-primary" data-bind="visible: isSignedIn, enable: !busy(), click: refresh, t: 'session.refresh'">Refresh</button>
    <form class="row g-2 mt-3" data-bind="visible: canElevate, submit: elevate">
        <div class="col-auto">
            <select class="form-select" aria-label="Role" data-bind="options: availableTargets, optionsText: 'label', optionsValue: 'value', value: target, tAttr: { 'aria-label': 'session.role' }"></select>
        </div>
        <div class="col-auto">
            <input type="text" class="form-control" inputmode="numeric" autocomplete="one-time-code" placeholder="Authenticator code" aria-label="Authenticator code" data-bind="textInput: code, tAttr: { placeholder: 'session.authenticatorCode', 'aria-label': 'session.authenticatorCode' }">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-danger" data-bind="enable: !busy() && code().trim() !== '', t: 'session.elevate'">Elevate</button>
        </div>
    </form>
</section>

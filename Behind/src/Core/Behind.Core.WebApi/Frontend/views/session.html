<section>
    <h1 class="mb-3">Session</h1>
    <p data-bind="visible: !isSignedIn()">You are not signed in. <a href="#/sign-in">Sign in</a> to see your session.</p>
    <div class="alert alert-info" role="alert" data-bind="visible: hasMessage, text: message"></div>
    <div data-bind="with: details">
        <h2 class="h4 mt-4">User</h2>
        <dl class="row behind-details">
            <dt class="col-sm-4">Name</dt>
            <dd class="col-sm-8" data-bind="text: displayName"></dd>
            <dt class="col-sm-4">User id</dt>
            <dd class="col-sm-8" data-bind="text: userId"></dd>
            <dt class="col-sm-4">Emails</dt>
            <dd class="col-sm-8">
                <ul class="list-unstyled mb-0" data-bind="foreach: emails">
                    <li data-bind="text: $data"></li>
                </ul>
            </dd>
            <dt class="col-sm-4">Roles</dt>
            <dd class="col-sm-8">
                <ul class="list-unstyled mb-0" data-bind="foreach: roles">
                    <li><strong data-bind="text: name"></strong> <span class="text-body-secondary" data-bind="text: grants"></span></li>
                </ul>
            </dd>
        </dl>
        <h2 class="h4 mt-4">Details</h2>
        <dl class="row behind-details">
            <dt class="col-sm-4">Session id</dt>
            <dd class="col-sm-8" data-bind="text: sessionId"></dd>
            <dt class="col-sm-4">Started</dt>
            <dd class="col-sm-8" data-bind="text: startedAt"></dd>
            <dt class="col-sm-4">Age</dt>
            <dd class="col-sm-8" data-bind="text: length"></dd>
            <dt class="col-sm-4">Expires</dt>
            <dd class="col-sm-8"><span data-bind="text: expiresAt"></span> (<span data-bind="text: remaining"></span> left)</dd>
            <dt class="col-sm-4">Access token issued</dt>
            <dd class="col-sm-8" data-bind="text: accessTokenIssuedAt"></dd>
            <dt class="col-sm-4">Access token expires</dt>
            <dd class="col-sm-8"><span data-bind="text: accessTokenExpiresAt"></span> (<span data-bind="text: accessTokenRemaining"></span> left)</dd>
            <dt class="col-sm-4">Remote address</dt>
            <dd class="col-sm-8" data-bind="text: remoteAddress"></dd>
            <dt class="col-sm-4">User agent</dt>
            <dd class="col-sm-8" data-bind="text: userAgent"></dd>
        </dl>
    </div>
    <button type="button" class="btn btn-primary" data-bind="visible: isSignedIn, enable: !busy(), click: refresh">Refresh</button>
    <form class="row g-2 mt-3" data-bind="visible: canElevate, submit: elevate">
        <div class="col-auto">
            <select class="form-select" aria-label="Role" data-bind="options: availableTargets, optionsText: 'label', optionsValue: 'value', value: target"></select>
        </div>
        <div class="col-auto">
            <input type="text" class="form-control" inputmode="numeric" autocomplete="one-time-code" placeholder="Authenticator code" aria-label="Authenticator code" data-bind="textInput: code">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-danger" data-bind="enable: !busy() && code().trim() !== ''">Elevate</button>
        </div>
    </form>
</section>

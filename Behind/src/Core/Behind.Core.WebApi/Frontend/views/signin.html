<section>
    <h1 class="mb-3">Sign in</h1>
    <form data-bind="submit: submit">
        <div class="mb-3">
            <label class="form-label" for="signin-email">Email</label>
            <input id="signin-email" class="form-control" type="email" autocomplete="username" required data-bind="value: email">
        </div>
        <div class="mb-3">
            <label class="form-label" for="signin-password">Password</label>
            <input id="signin-password" class="form-control" type="password" autocomplete="current-password" data-bind="value: password">
        </div>
        <div class="d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-primary" data-bind="enable: !busy()">Sign in</button>
            <button type="button" class="btn btn-outline-secondary" data-bind="enable: !busy(), click: requestMagicLink">Email me a sign in link</button>
        </div>
    </form>
    <p class="mt-3" role="status" data-bind="visible: hasMessage, text: message"></p>
</section>

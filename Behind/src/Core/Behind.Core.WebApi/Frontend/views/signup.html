<section>
    <h1 class="mb-3" data-bind="t: 'signup.title'">Sign up</h1>
    <form data-bind="submit: submit">
        <div class="mb-3">
            <label class="form-label" for="signup-email" data-bind="t: 'signup.email'">Email</label>
            <input id="signup-email" class="form-control" type="email" autocomplete="username" required data-bind="value: email">
        </div>
        <div class="mb-3">
            <label class="form-label" for="signup-display-name"><span data-bind="t: 'signup.displayName'">Display name</span> <span class="text-body-secondary" data-bind="t: 'signup.optional'">(optional)</span></label>
            <input id="signup-display-name" class="form-control" type="text" maxlength="500" autocomplete="nickname" data-bind="value: displayName">
            <div class="form-text" data-bind="t: 'signup.displayNameHelp'">If left empty, your email address is shown instead.</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="signup-password" data-bind="t: 'signup.password'">Password</label>
            <input id="signup-password" class="form-control" type="password" autocomplete="new-password" required data-bind="value: password">
        </div>
        <captcha params="captcha: captcha"></captcha>
        <button type="submit" class="btn btn-primary" data-bind="enable: !busy(), t: 'signup.submit'">Create account</button>
    </form>
    <p class="mt-3" role="status" data-bind="visible: hasMessage, text: message"></p>
</section>

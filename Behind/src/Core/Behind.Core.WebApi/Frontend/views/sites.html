<section class="behind-wide">
    <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
        <h1 class="mb-0" data-bind="t: 'sites.title'">Sites</h1>
        <a class="btn btn-primary ms-auto" href="#/sites/new" data-bind="visible: canWrite, t: 'sites.new'">New site</a>
    </div>
    <p data-bind="visible: !isSignedIn()"><span data-bind="t: 'common.notSignedIn'">You are not signed in.</span> <a href="#/sign-in" data-bind="t: 'app.signIn'">Sign in</a> <span data-bind="t: 'sites.signInToManage'">to manage sites.</span></p>
    <div class="alert alert-warning" role="alert" data-bind="visible: isDenied, t: 'sites.denied'">You need site access to manage sites.</div>
    <div class="alert alert-info" role="alert" data-bind="visible: list.hasMessage, text: list.message"></div>
    <div data-bind="visible: canRead, with: list">
        <form class="input-group mb-3" data-bind="submit: find">
            <input class="form-control" type="search" maxlength="200" placeholder="Search by title or slug" aria-label="Search sites" data-bind="value: search, tAttr: { placeholder: 'sites.search.placeholder', 'aria-label': 'sites.search.label' }">
            <button type="submit" class="btn btn-primary" data-bind="enable: !busy(), t: 'common.search'">Search</button>
        </form>
        <div class="form-check form-switch mb-3" data-bind="visible: canViewDeleted">
            <label class="form-check-label"><input class="form-check-input" type="checkbox" role="switch" data-bind="checked: showDeleted, enable: !busy()"> <span data-bind="t: 'sites.showDeleted'">Show deleted sites</span></label>
        </div>
        <letter-pager class="d-block mb-3" params="pager: letterPager"></letter-pager>
        <p class="text-body-secondary" data-bind="visible: !hasItems(), t: 'sites.empty'">No sites found.</p>
        <ul class="list-group mb-3" data-bind="foreach: items">
            <li class="list-group-item d-flex flex-wrap align-items-center gap-2">
                <div class="me-auto">
                    <a class="fw-bold text-break" data-bind="attr: { href: href }, text: title, visible: !isDeleted"></a>
                    <strong class="text-break" data-bind="text: title, visible: isDeleted"></strong>
                    <div class="small text-body-secondary text-break">#/<span data-bind="text: slug"></span></div>
                </div>
                <span class="badge text-bg-primary" data-bind="visible: isIndex, t: 'sites.customIndex'">Custom index</span>
                <span class="badge text-bg-dark" data-bind="visible: isDeleted, t: 'common.deleted'">Deleted</span>
                <span class="badge" data-bind="text: status, css: statusCss, visible: !isDeleted"></span>
                <span class="small text-body-secondary" data-bind="t: { key: 'sites.versions', args: [latestVersion, activeVersion] }">Version <span data-bind="text: latestVersion"></span>, live: <span data-bind="text: activeVersion"></span></span>
                <span class="small text-body-secondary" data-bind="text: updatedAt"></span>
                <button type="button" class="btn btn-sm btn-outline-danger" data-bind="visible: !isDeleted && $root.canDelete(), enable: !$parent.busy(), click: remove, t: 'common.delete'">Delete</button>
                <button type="button" class="btn btn-sm btn-outline-success" data-bind="visible: isDeleted && $parent.canViewDeleted(), enable: !$parent.busy(), click: restore, t: 'common.restore'">Restore</button>
                <button type="button" class="btn btn-sm btn-danger" data-bind="visible: isDeleted && $parent.canViewDeleted(), enable: !$parent.busy(), click: hardDelete, t: 'common.deletePermanently'">Delete permanently</button>
            </li>
        </ul>
        <pager class="d-block" params="pager: pager"></pager>
    </div>
</section>

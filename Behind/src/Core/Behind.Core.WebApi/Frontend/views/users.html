<section class="behind-wide">
    <h1 class="mb-3">Users</h1>
    <p data-bind="visible: !isSignedIn()">You are not signed in. <a href="#/sign-in">Sign in</a> to manage users.</p>
    <div class="alert alert-warning" role="alert" data-bind="visible: isDenied">You need administrator access to manage users.</div>
    <div class="alert alert-info" role="alert" data-bind="visible: hasMessage, text: message"></div>
    <div data-bind="visible: canManage">
        <form class="input-group mb-3" data-bind="submit: find">
            <input class="form-control" type="search" maxlength="200" placeholder="Search by name or email" aria-label="Search users" data-bind="value: search">
            <button type="submit" class="btn btn-primary" data-bind="enable: !busy()">Search</button>
        </form>
        <letter-pager class="d-block mb-3" params="pager: letterPager"></letter-pager>
        <p class="text-body-secondary" data-bind="visible: !hasUsers()">No users found.</p>
        <ul class="list-group mb-3" data-bind="foreach: users">
            <li class="list-group-item">
                <div class="d-flex flex-wrap align-items-center gap-2">
                    <strong class="text-break" data-bind="text: name"></strong>
                    <span class="badge text-bg-secondary" data-bind="visible: isCurrent">You</span>
                    <span class="badge text-bg-danger" data-bind="visible: isBanned">Banned</span>
                </div>
                <div class="text-body-secondary text-break small" data-bind="text: emails"></div>
                <div class="d-flex flex-wrap gap-1 my-2" data-bind="foreach: roles">
                    <span class="badge text-bg-info" data-bind="text: $data"></span>
                </div>
                <p class="text-danger mb-2" data-bind="visible: isBanned">Ban message: <span class="text-break" data-bind="text: banReason"></span></p>
                <div class="d-flex flex-wrap gap-2" data-bind="visible: hasActions">
                    <div class="d-flex flex-wrap gap-2" data-bind="foreach: roleActions">
                        <button type="button" class="btn btn-sm" data-bind="css: granted ? 'btn-outline-warning' : 'btn-outline-primary', text: label, enable: !$root.busy(), visible: allowed, click: run"></button>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-bind="visible: canModerate, enable: !$root.busy(), click: signOut">Sign out everywhere</button>
                    <button type="button" class="btn btn-sm btn-outline-danger" data-bind="visible: canModerate && !isBanned && !banning(), enable: !$root.busy(), click: startBan">Ban</button>
                    <button type="button" class="btn btn-sm btn-outline-success" data-bind="visible: canModerate && isBanned, enable: !$root.busy(), click: unban">Unban</button>
                </div>
                <form class="mt-3" data-bind="visible: banning, submit: confirmBan">
                    <label class="form-label">Ban message shown on the wall of shame
                        <textarea class="form-control" rows="2" maxlength="500" required data-bind="value: banMessage, valueUpdate: 'input'"></textarea>
                    </label>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-sm btn-danger" data-bind="enable: canConfirmBan() && !$root.busy()">Ban user</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" data-bind="click: cancelBan">Cancel</button>
                    </div>
                </form>
            </li>
        </ul>
        <pager class="d-block" params="pager: pager"></pager>
    </div>
</section>

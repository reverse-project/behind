<section class="behind-wide">
    <h1 data-bind="t: 'sport.players.title'">Players</h1>
    <nav class="d-flex flex-wrap gap-2 mb-2">
        <a class="btn btn-sm" data-bind="css: disciplineId() === null ? 'btn-primary' : 'btn-outline-primary', attr: { href: links.players }, t: 'sport.filter.all'">All</a>
        <!-- ko foreach: disciplines -->
        <a class="btn btn-sm" data-bind="css: id === $parent.disciplineId() ? 'btn-primary' : 'btn-outline-primary', attr: { href: $parent.links.playersOf(id) }, text: name"></a>
        <!-- /ko -->
    </nav>
    <nav class="d-flex flex-wrap gap-2 mb-3" data-bind="visible: positions().length > 0">
        <a class="btn btn-sm" data-bind="css: positionId === null ? 'btn-secondary' : 'btn-outline-secondary', attr: { href: links.playersOf(disciplineId()) }, t: 'sport.filter.allPositions'">All positions</a>
        <!-- ko foreach: positions -->
        <a class="btn btn-sm" data-bind="css: id === $parent.positionId ? 'btn-secondary' : 'btn-outline-secondary', attr: { href: $parent.links.position(id) }, text: name"></a>
        <!-- /ko -->
    </nav>
    <p data-bind="visible: positionName() !== ''"><span data-bind="t: 'sport.players.byPosition'">Position:</span> <sport-link params="kind: 'position', id: positionId, text: positionName"></sport-link></p>
    <div data-bind="with: list">
        <form class="input-group mb-3" data-bind="submit: find">
            <input class="form-control" type="search" maxlength="200" placeholder="Search by name" aria-label="Search players" data-bind="value: search, tAttr: { placeholder: 'sport.players.searchPlaceholder', 'aria-label': 'sport.players.searchLabel' }">
            <button type="submit" class="btn btn-primary" data-bind="enable: !loading(), t: 'common.search'">Search</button>
        </form>
        <div class="alert alert-info" role="alert" data-bind="visible: message() !== '', text: message"></div>
        <p class="text-body-secondary" data-bind="visible: isEmpty, t: 'sport.players.empty'">No players found.</p>
        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3 mb-3" data-bind="foreach: items">
            <div class="col">
                <div class="card h-100 text-center">
                    <div class="card-body d-flex flex-column align-items-center gap-2">
                        <a data-bind="attr: { href: $root.links.player(id) }"><sport-thumbnail params="url: pictureUrl, kind: 'player', size: 7, alt: name"></sport-thumbnail></a>
                        <h2 class="h6 mb-0"><sport-link params="kind: 'player', id: id, text: name"></sport-link></h2>
                        <div class="small"><sport-link params="kind: 'position', id: positionId, text: positionName"></sport-link></div>
                        <div class="small"><sport-link params="kind: 'team', id: teamId, text: teamName"></sport-link></div>
                        <div class="small text-body-secondary" data-bind="visible: $root.format.present(age), text: $root.format.age(age)"></div>
                    </div>
                </div>
            </div>
        </div>
        <pager class="d-block" params="pager: pager"></pager>
    </div>
</section>

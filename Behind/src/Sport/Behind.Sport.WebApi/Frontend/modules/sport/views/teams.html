<section class="behind-wide">
    <h1 data-bind="t: 'sport.teams.title'">Teams</h1>
    <nav class="d-flex flex-wrap gap-2 mb-3">
        <a class="btn btn-sm" data-bind="css: disciplineId === null ? 'btn-primary' : 'btn-outline-primary', attr: { href: links.teams }, t: 'sport.filter.all'">All</a>
        <!-- ko foreach: disciplines -->
        <a class="btn btn-sm" data-bind="css: id === $parent.disciplineId ? 'btn-primary' : 'btn-outline-primary', attr: { href: $parent.links.teamsOf(id) }, text: name"></a>
        <!-- /ko -->
    </nav>
    <div data-bind="with: list">
        <form class="input-group mb-3" data-bind="submit: find">
            <input class="form-control" type="search" maxlength="200" placeholder="Search by name" aria-label="Search teams" data-bind="value: search, tAttr: { placeholder: 'sport.teams.searchPlaceholder', 'aria-label': 'sport.teams.searchLabel' }">
            <button type="submit" class="btn btn-primary" data-bind="enable: !loading(), t: 'common.search'">Search</button>
        </form>
        <div class="alert alert-info" role="alert" data-bind="visible: message() !== '', text: message"></div>
        <p class="text-body-secondary" data-bind="visible: isEmpty, t: 'sport.teams.empty'">No teams found.</p>
        <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3 mb-3" data-bind="foreach: items">
            <div class="col">
                <div class="card h-100 text-center">
                    <div class="card-body d-flex flex-column align-items-center gap-2">
                        <a data-bind="attr: { href: $root.links.team(id) }"><sport-thumbnail params="url: logoUrl, kind: 'team', size: 6, alt: name"></sport-thumbnail></a>
                        <h2 class="h6 mb-0"><sport-link params="kind: 'team', id: id, text: name"></sport-link></h2>
                        <div class="small"><sport-link params="kind: 'discipline', id: disciplineId, text: disciplineName"></sport-link></div>
                        <div class="small text-body-secondary text-break" data-bind="text: [city, country].filter(Boolean).join(', ')"></div>
                    </div>
                </div>
            </div>
        </div>
        <pager class="d-block" params="pager: pager"></pager>
    </div>
</section>
